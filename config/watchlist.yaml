# Symbols to fetch / backtest / scan. Extend freely.
crypto:
  exchange: "okx"          # ccxt id serving public OHLCV; fallback bybit
  fallback_exchange: "bybit"  # note: bybit may be geo/CDN-blocked on some networks
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  timeframes: ["1d", "4h", "1h"]

forex:
  symbols:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "AUDUSD"
    - "XAUUSD"
  timeframes: ["4h", "1h", "15m"]
  # yfinance ticker mapping (fallback source)
  yf_map:
    EURUSD: "EURUSD=X"
    GBPUSD: "GBPUSD=X"
    USDJPY: "USDJPY=X"
    AUDUSD: "AUDUSD=X"
    XAUUSD: "XAUUSD=X"

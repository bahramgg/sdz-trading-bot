# Trading cost model (master plan §3).

crypto:
  taker_fee_pct: 0.055     # % per side
  slippage_bps: 2          # SLIP_BPS

# Forex spread per pair, applied on entry and exit. Value is in PRICE units.
# (pip sizes: JPY pairs 0.01, others 0.0001, XAUUSD 0.01)
forex:
  spread:
    EURUSD: 0.00007        # 0.7 pip
    GBPUSD: 0.00009        # 0.9 pip
    USDJPY: 0.009          # 0.9 pip
    AUDUSD: 0.00008        # 0.8 pip
    XAUUSD: 0.25           # 25 cents
  slippage_bps: 1
